const scripts={
intro:[['地の文','街外れの洋館。月詠るなは、ここから漏れ出す妖魔の反応を追ってやってきた。','normal'],['月詠るな','「……間違いありません。この建物からです」','normal'],['地の文','人の気配がないことを確かめ、るなは月の力を呼び起こす。青白い光が身体を包んだ。','power'],['セーラールナ','「……変身完了です。慎重に調べてみましょう」','normal'],['地の文','重い玄関扉を押し開くと、古い木の匂いが漂ってきた。','alert']],
hallfirst:[['セーラールナ','「静かですね……。正面には古時計、左右には部屋があります」','normal'],['地の文','そのとき、二階の方からコツ……コツ……と小さな足音が聞こえた。','alert'],['セーラールナ','「……今の音は？　誰かいるのでしょうか」','alert']],
studyfirst:[['地の文','書斎には古い本棚と埃をかぶった机がある。','normal'],['セーラールナ','「この部屋なら、館のことが何かわかるかもしれません」','normal']],
diningfirst:[['地の文','食堂には長いテーブルが置かれている。誰もいないはずなのに、食器がかすかに震えた。','alert'],['セーラールナ','「……っ！　何かがいます！」','alert'],['地の文','テーブルの下から小さな妖魔が飛び出してきた！','alert'],['セーラールナ','「はあっ！」','power'],['地の文','ルナは素早く身をひるがえし、蹴りで妖魔を退ける。青い光が弾け、妖魔は霧のように消えた。','power'],['セーラールナ','「……倒せました。でも、この館にはまだ妖気が残っていますね」','normal']],
book:[['地の文','机の引き出しに、古びた日記が収められていた。','normal'],['セーラールナ','「『月が天頂に昇る刻、時計は道を示す』……真夜中のこと、でしょうか」','normal'],['地の文','地下への仕掛けの手掛かりを得た。','normal']],
bookshelf:[['地の文','本棚に触れた瞬間、一冊の本が床へ落ちた。バサッ！','alert'],['セーラールナ','「きゃっ！　……本が落ちただけ、ですか」','alert']],
clockbad:[['地の文','ゴォン！　ゴォン！　突然、古時計が鳴り響いた！','alert'],['セーラールナ','「きゃっ！？　……びっくりしました。違う時間だったようですね」','alert'],['地の文','鐘の音はすぐに止んだ。特に変わったことは起こらない。','normal']],
clockgood:[['地の文','針を真夜中に合わせると、カチリ、と内部で何かが外れる音がした。','alert'],['地の文','ゴゴゴ……。時計の背後の壁がゆっくりと動き、地下への階段が現れる。','alert'],['セーラールナ','「開きました！　……この先が妖気の発生源ですね」','normal']],
stairs:[['地の文','地下へ降りるにつれ、空気がひんやりと冷たくなる。','normal'],['地の文','暗闇の奥から、低い唸り声が響いた。','alert'],['セーラールナ','「……気を抜けませんね」','alert']],
altar:[['地の文','地下祭壇には紫色の光が渦巻いていた。その中心で、大きな妖魔がゆっくりと振り向く。','alert'],['ボス妖魔','「ここまで来たか、月の戦士よ。だが、この祭壇は渡さん！」','alert'],['セーラールナ','「この館を妖気で満たしていたのは、あなたですね。ここで止めます！」','power'],['地の文','妖魔の放った黒い衝撃が床を走る。ルナは身をかわし、距離を詰めた。','alert'],['セーラールナ','「はああっ！」','power'],['地の文','鋭い一撃が妖魔を捉える。しかし妖魔はなおも立ち上がり、紫色の霧を噴き出した。','alert'],['セーラールナ','「これで……終わりです！」','power'],['地の文','月光を帯びた一撃が闇を貫く。妖魔は光の中に消え、祭壇の妖気も静かに薄れていった。','power']],
ending:[['地の文','洋館を出る頃、東の空がわずかに白み始めていた。','normal'],['セーラールナ','「……これで、ひとまず安心ですね」','normal'],['地の文','るなは最後に洋館を振り返り、静かな帰り道を歩き始めた。','normal'],['地の文','――試作版クリア――','normal']]

let queue=[],after=null;
function save(){try{localStorage.setItem('luna_save',JSON.stringify(s));toast('セーブしました')}catch(e){toast('保存できませんでした')}}
function load(){try{const v=localStorage.getItem('luna_save');if(!v){toast('セーブデータがありません');return} s=JSON.parse(v);closeMenu();showRoom();toast('ロードしました')}catch(e){toast('読み込みに失敗しました')}}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}
function flash(){const e=$('flash');e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}
function startStory(lines,done){queue=lines;after=done||null;s.mode='story';s.index=0;showLine()}
function showLine(){if(s.index>=queue.length){const f=after;after=null;if(f)f();else explore();return}let [name,line,pose]=queue[s.index];$('speaker').textContent=name;$('dialogue').textContent=line;$('sprite').src=assets[pose||'normal'];$('sprite').className=pose==='power'?'action':pose==='alert'?'action':'';$('choices').style.display='none';$('next').style.display='block';s.history.push(name+'：'+line);if(s.history.length>80)s.history.shift()}
function advance(){if(s.mode!=='story')return;s.index++;showLine()}
function showRoom(){const r=s.room;$('scene').className=r;$('location').textContent=rooms[r];if(s.mode==='explore')explore()}
function move(room){s.room=room;showRoom();if(room==='hall'&&!s.visited.includes('hall')){s.visited.push('hall');startStory(scripts.hallfirst);return}if(room==='study'&&!s.visited.includes('study')){s.visited.push('study');startStory(scripts.studyfirst);return}if(room==='dining'&&!s.fight1){s.fight1=true;startStory(scripts.diningfirst);return}if(room==='stairs'&&!s.visited.includes('stairs')){s.visited.push('stairs');startStory(scripts.stairs);return}if(room==='altar'&&!s.boss){s.boss=true;startStory(scripts.altar,()=>move('ending'));return}if(room==='ending'){startStory(scripts.ending,()=>{s.mode='end';options([['最初から遊ぶ',()=>reset()],['メニューを開く',openMenu]])});return}explore()}
function options(items){let c=$('choices');c.innerHTML='';items.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=e=>{e.stopPropagation();fn()};c.appendChild(b)});c.style.display='flex'}
function explore(){s.mode='explore';$('sprite').src=assets.normal;$('sprite').className='';$('speaker').textContent='セーラールナ';$('next').style.display='none';let r=s.room,items=[];if(r==='hall'){$('dialogue').textContent=s.clock?'「地下への階段が開いています。先へ進みましょう」':'「どこから調べましょうか……」';items=[['書斎へ行く',()=>move('study')],['食堂へ行く',()=>move('dining')],['古時計を調べる',clock]];if(s.clock)items.push(['地下への階段を降りる',()=>move('stairs')]);}
else if(r==='study'){$('dialogue').textContent='「机と本棚がありますね」';items=[['机を調べる',()=>{if(!s.clue){s.clue=true;startStory(scripts.book)}else startStory([['セーラールナ','「日記には真夜中の時計について書かれていましたね」','normal']])}],['本棚を調べる',()=>{if(!s.flags.book){s.flags.book=true;flash();startStory(scripts.bookshelf)}else startStory([['セーラールナ','「ほかには何もなさそうですね」','normal']])}],['玄関ホールへ戻る',()=>move('hall')]]}
else if(r==='dining'){$('dialogue').textContent='「もう妖魔の気配はありませんね」';items=[['食卓を調べる',()=>startStory([['地の文','古びた食器が並んでいる。今は静まり返っている。','normal']])],['玄関ホールへ戻る',()=>move('hall')]]}
else if(r==='stairs'){$('dialogue').textContent='「この奥から、強い妖気を感じます……」';items=[['地下祭壇へ進む',()=>move('altar')],['玄関ホールへ戻る',()=>move('hall')]]}
else if(r==='outside'){$('dialogue').textContent='「この館に妖魔の反応が……」';items=[['探索を始める',()=>startStory(scripts.intro,()=>move('hall'))]]}
options(items)}
function clock(){if(!s.clue){startStory([['セーラールナ','「古時計ですね。針を動かせそうですが、正しい時刻の手掛かりが必要です」','normal']]);return}if(s.clock){startStory([['セーラールナ','「もう仕掛けは解けています。地下への道が開いています」','normal']]);return}s.mode='explore';$('dialogue').textContent='「日記の言葉を思い出して……どの時刻でしょう？」';options([['午前3時',()=>wrong()],['午前6時',()=>wrong()],['午前0時（真夜中）',()=>{s.clock=true;flash();startStory(scripts.clockgood)}],['やめる',explore]])}
function wrong(){flash();startStory(scripts.clockbad)}
function reset(){s={room:'outside',mode:'explore',index:0,visited:[],clue:false,clock:false,fight1:false,fight2:false,boss:false,flags:{},history:[]};closeMenu();showRoom();explore()}
function openMenu(){let m=$('modal');m.innerHTML='<h2>☾ 月影の洋館</h2><p>基本システム試作版 / セーブはこのブラウザ内に保存されます。</p>';const actions=[['ゲームに戻る',closeMenu],['セーブ',()=>{save();closeMenu()}],['ロード',load],['バックログ',()=>{m.innerHTML='<h2>バックログ</h2><div style="overflow:auto;max-height:55vh;font-size:12px;line-height:1.8;white-space:pre-wrap">'+s.history.map(x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('\n\n')+'</div>';addButton(m,'戻る',openMenu)}],['最初から',()=>{if(confirm('最初から始めますか？'))reset()}]];actions.forEach(([t,f])=>addButton(m,t,f));$('overlay').style.display='flex'}
function addButton(p,t,f){let b=document.createElement('button');b.textContent=t;b.onclick=f;p.appendChild(b)}
function closeMenu(){$('overlay').style.display='none'}
$('box').onclick=advance;$('menuBtn').onclick=openMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if((e.key===' '||e.key==='Enter')&&$('overlay').style.display!=='flex'){e.preventDefault();advance()}});
showRoom();explore();
</script></body></html>
